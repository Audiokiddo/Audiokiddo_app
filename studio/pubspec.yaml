name: audiokiddo_studio
description: AudioKiddo Studio — panel treści dla Dawida i Neli (Flutter Web).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ak_core:
    path: ../packages/ak_core
  flutter_riverpod: ^3.4.3
  file_selector: ^1.1.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  web: ^1.1.1
  supabase: ^2.16.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # The app's built-in catalog (tool/studio_build.sh refreshes it): Studio starts from it.
    - assets/app_catalog.json
    - assets/brand/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
