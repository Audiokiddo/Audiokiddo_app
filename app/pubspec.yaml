name: audiokiddo
description: AudioKiddo — interaktywne audiozabawy i piosenki dla dzieci.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  ak_core:
    path: ../packages/ak_core
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  background_downloader: ^9.6.3
  crypto: ^3.0.7
  path: ^1.9.1
  pdf: ^3.11.0
  printing: ^5.15.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  in_app_purchase_storekit: ^0.4.13
  url_launcher: ^6.3.2
  supabase_flutter: ^2.17.2
  record: ^7.1.1
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  home_widget: ^0.10.0
  share_plus: ^13.3.0
  speech_to_text: ^7.5.0
  swipeable_page_route: ^0.4.8
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mock/
    - assets/case_files.json
    - assets/guide_links.json
    - assets/audio/
    - assets/audio/kiddo/
    - assets/covers/
    - assets/szop/
    - assets/brand/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
