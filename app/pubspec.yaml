name: audiokiddo
description: AudioKiddo — interaktywne audiozabawy i piosenki dla dzieci.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  ak_core:
    path: ../packages/ak_core
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  background_downloader: ^9.6.3
  crypto: ^3.0.7
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mock/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
