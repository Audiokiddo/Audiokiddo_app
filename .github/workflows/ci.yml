# Tests and builds on every push. Store signing and upload are added in Etap 6, once the
# developer accounts and signing secrets exist (see docs/WYDANIE.md).
name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  core:
    name: ak_core (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ak_core
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    name: Aplikacja (analiza i testy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --timeout 60s
      # The App Store build (tool/release_build.sh ios): number question everywhere, no code field.
      - name: Tests as the App Store build
        run: flutter test --timeout 60s --dart-define=PARENT_GATE_EVERYWHERE=true --dart-define=REDEEM_CODES=false

  studio:
    name: Studio (testy i build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --timeout 60s
      - run: flutter build web --release

  backend:
    name: Serwer (schemat i funkcje)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
      - name: Schema tests
        run: PG_BIN=/usr/lib/postgresql/17/bin tool/test_db.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Function tests
        working-directory: supabase/functions
        run: |
          deno test _shared/
          deno check woo-webhook/index.ts sync-web-purchases/index.ts delete-account/index.ts
          deno lint

  android:
    name: Build Android (bez podpisu sklepowego)
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: audiokiddo-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios:
    name: Build iOS (bez podpisu)
    needs: app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
